<!DOCTYPE html>
<html lang="vi" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VPS Commander Dashboard by MHL_ATP6</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-5px); }
        }
        .animate-float { animation: float 4s ease-in-out infinite; }
        .glass-panel {
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .glow-effect:hover {
            box-shadow: 0 0 25px rgba(59, 130, 246, 0.25);
            border-color: rgba(59, 130, 246, 0.4);
        }
    </style>
</head>
<body class="bg-[#030712] text-slate-100 min-h-screen relative overflow-x-hidden">
    <div class="absolute top-0 left-1/4 w-96 h-96 bg-blue-600/10 rounded-full blur-3xl pointer-events-none"></div>
    <div class="absolute top-1/3 right-1/4 w-96 h-96 bg-purple-600/10 rounded-full blur-3xl pointer-events-none"></div>

    <header class="glass-panel sticky top-0 z-50 px-6 py-4 flex justify-between items-center border-b border-slate-800/80 shadow-2xl">
        <div class="flex items-center space-x-3">
            <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-blue-600 to-indigo-500 flex items-center justify-center font-extrabold text-lg shadow-lg shadow-blue-500/30 animate-float">
                ⚡
            </div>
            <div>
                <h1 class="text-lg font-bold bg-gradient-to-r from-blue-400 via-indigo-300 to-purple-400 bg-clip-text text-transparent">VPS Commander</h1>
                <p class="text-xs text-slate-400 font-medium tracking-wide">Quản lý GitHub Actions <span class="text-blue-400 font-semibold">by MHL_ATP6</span></p>
            </div>
        </div>
        <div class="flex items-center gap-3">
            <div class="hidden md:flex items-center gap-2 bg-slate-900/80 border border-slate-800 px-3 py-1.5 rounded-xl">
                <span class="text-xs text-slate-400">Token:</span>
                <input type="password" id="global-token" placeholder="Dán token tùy chỉnh..." onchange="saveToken(this.value)" class="bg-transparent text-xs text-slate-200 focus:outline-none w-36 font-mono">
            </div>
            <button onclick="openModal()" class="group relative px-5 py-2.5 rounded-xl bg-gradient-to-r from-blue-600 to-indigo-600 text-white font-semibold text-sm transition-all duration-300 hover:scale-105 hover:shadow-lg hover:shadow-blue-500/25 active:scale-95 flex items-center gap-2 overflow-hidden">
                <span class="absolute inset-0 bg-white/25 translate-y-full group-hover:translate-y-0 transition-transform duration-300"></span>
                <span class="relative">➕ Thêm VPS Mới</span>
            </button>
        </div>
    </header>

    <main class="max-w-7xl mx-auto p-6 relative z-10 pb-24">
        <div id="vps-grid" class="grid grid-cols-1 xl:grid-cols-2 gap-6"></div>
        
        <div id="empty-state" class="text-center py-32 hidden transition-all duration-500 transform scale-95 opacity-0">
            <div class="w-20 h-20 mx-auto mb-4 rounded-2xl bg-slate-900 border border-slate-800 flex items-center justify-center text-3xl shadow-xl">
                🛰️
            </div>
            <h3 class="text-xl font-bold text-slate-300 mb-1">Chưa có trạm VPS nào</h3>
            <p class="text-slate-500 text-sm max-w-sm mx-auto">Hãy nhập token GitHub và bấm "Thêm VPS Mới" để tạo máy chủ.</p>
        </div>
    </main>

    <!-- Góc Đo Mạng Thực Tế -->
    <div class="fixed bottom-6 left-6 z-40 glass-panel p-3.5 rounded-2xl shadow-2xl shadow-black/50 border border-slate-700/50 flex flex-col gap-2.5 hover:border-blue-500/50 transition-colors duration-300 backdrop-blur-xl">
        <div class="flex items-center justify-between gap-4">
            <div class="flex items-center gap-2 text-[11px] font-bold text-slate-400 uppercase tracking-widest">
                <span class="relative flex h-2.5 w-2.5">
                    <span id="net-ping-dot" class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                    <span id="net-status-dot" class="relative inline-flex rounded-full h-2.5 w-2.5 bg-emerald-500"></span>
                </span>
                <span>Kiểm Tra Mạng (Fast Style)</span>
            </div>
            <button onclick="measureRealSpeed()" class="text-[10px] text-blue-400 hover:text-blue-300 underline bg-blue-500/10 px-2 py-0.5 rounded transition">Đo lại</button>
        </div>
        <div class="flex gap-5">
            <div>
                <div class="text-slate-500 text-[10px] uppercase font-semibold mb-0.5">Độ trễ (Ping)</div>
                <div class="text-emerald-400 font-mono font-bold text-sm tracking-tight" id="net-ping">... ms</div>
            </div>
            <div class="w-px bg-slate-800/80"></div>
            <div>
                <div class="text-slate-500 text-[10px] uppercase font-semibold mb-0.5">Tốc độ thực tế</div>
                <div class="text-blue-400 font-mono font-bold text-sm tracking-tight" id="net-speed">Đang đo...</div>
            </div>
        </div>
    </div>

    <!-- Modal Thêm VPS -->
    <div id="vps-modal" class="fixed inset-0 bg-black/80 backdrop-blur-md flex items-center justify-center z-50 hidden opacity-0 transition-opacity duration-300 px-4">
        <div class="glass-panel rounded-3xl w-full max-w-md p-7 shadow-2xl transform scale-95 transition-transform duration-300 border border-slate-700/50" id="modal-box">
            <div class="flex justify-between items-center mb-5">
                <h2 class="text-xl font-bold flex items-center gap-2 text-slate-100">🚀 Khởi Tạo VPS Mới</h2>
                <button onclick="closeModal()" class="text-slate-400 hover:text-white p-1.5 rounded-xl hover:bg-slate-800/80 transition">✕</button>
            </div>
            <form id="vps-form" onsubmit="createNewVPS(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">GitHub Token (Cá nhân của bạn)</label>
                    <input type="password" id="modal-token-input" placeholder="ghp_xxxxxxxxxxxxxxxxxxxx" class="w-full bg-slate-950/80 border border-slate-800 rounded-xl px-4 py-3 text-slate-100 text-sm focus:outline-none focus:border-blue-500 font-mono">
                    <p class="text-[10px] text-slate-500 mt-1">Để trống nếu muốn dùng token mặc định của hệ thống.</p>
                </div>
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">Tên định danh VPS</label>
                    <input type="text" id="vps-name-input" required class="w-full bg-slate-950/80 border border-slate-800 rounded-xl px-4 py-3 text-slate-100 text-sm focus:outline-none focus:border-blue-500 font-mono shadow-inner" placeholder="Ví dụ: windows-server-01">
                </div>
                <div class="flex justify-end space-x-3 pt-3">
                    <button type="button" onclick="closeModal()" class="px-5 py-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 font-medium text-sm transition">Hủy</button>
                    <button type="submit" class="px-5 py-2.5 rounded-xl bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white font-semibold text-sm transition shadow-lg shadow-blue-600/30">Tạo & Kích Hoạt</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        async function measureRealSpeed() {
            const pingEl = document.getElementById('net-ping');
            const speedEl = document.getElementById('net-speed');
            if (!navigator.onLine) { pingEl.innerHTML = "OFFLINE"; speedEl.innerHTML = "0 Mbps"; return; }
            const testFileUrl = "https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/3.3.3/tailwind.min.css?t=" + Date.now();
            const startTime = performance.now();
            try {
                const response = await fetch(testFileUrl, { cache: 'no-store' });
                await response.blob();
                const durationInSeconds = (performance.now() - startTime) / 1000;
                const pingTime = Math.round(durationInSeconds * 200); 
                pingEl.innerHTML = `⚡ ${pingTime} ms`;
                const speedMbps = ((250000 * 8 / durationInSeconds) / 1_000_000).toFixed(1);
                speedEl.innerHTML = `⬇ ${speedMbps} Mbps`;
            } catch (error) { pingEl.innerHTML = "Lỗi"; speedEl.innerHTML = "0 Mbps"; }
        }
        measureRealSpeed();
        setInterval(measureRealSpeed, 15000);

        function getToken() {
            return localStorage.getItem('custom_gh_token') || document.getElementById('global-token').value.trim();
        }

        function saveToken(val) {
            localStorage.setItem('custom_gh_token', val.trim());
            fetchVPSListFromGitHub();
        }

        window.addEventListener('DOMContentLoaded', () => {
            const saved = localStorage.getItem('custom_gh_token');
            if (saved) {
                document.getElementById('global-token').value = saved;
                document.getElementById('modal-token-input').value = saved;
            }
            fetchVPSListFromGitHub();
        });

        function openModal() {
            const modal = document.getElementById('vps-modal');
            const box = document.getElementById('modal-box');
            const saved = localStorage.getItem('custom_gh_token');
            if (saved) document.getElementById('modal-token-input').value = saved;
            
            modal.classList.remove('hidden');
            setTimeout(() => { modal.classList.remove('opacity-0'); box.classList.remove('scale-95'); box.classList.add('scale-100'); }, 10);
        }

        function closeModal() {
            const modal = document.getElementById('vps-modal');
            const box = document.getElementById('modal-box');
            modal.classList.add('opacity-0');
            box.classList.remove('scale-100');
            box.classList.add('scale-95');
            setTimeout(() => { modal.classList.add('hidden'); document.getElementById('vps-form').reset(); }, 300);
        }

        async function createNewVPS(e) {
            e.preventDefault();
            const name = document.getElementById('vps-name-input').value.trim();
            const tokenInput = document.getElementById('modal-token-input').value.trim();
            if (tokenInput) saveToken(tokenInput);
            
            if (!name) return;
            alert("Đang gửi yêu cầu khởi tạo kho lưu trữ và chạy workflow lên GitHub...");
            try {
                let res = await fetch('/api/create', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name: name, token: getToken() })
                });
                let result = await res.json();
                if (result.success) {
                    alert(result.message);
                    closeModal();
                    fetchVPSListFromGitHub();
                } else { alert("Lỗi: " + result.error); }
            } catch (err) { alert("Lỗi kết nối server!"); }
        }

        function formatTimeRemaining(createdAt) {
            const cycleSeconds = 18000;
            const remaining = cycleSeconds - (Date.now() / 1000 - createdAt);
            if (remaining <= 0) return "Đang gia hạn...";
            let hours = Math.floor(remaining / 3600);
            let minutes = Math.floor((remaining % 3600) / 60);
            let seconds = Math.floor(remaining % 60);
            return `${hours.toString().padStart(2, '0')}:${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
        }

        async function fetchVPSListFromGitHub() {
            try {
                let headers = { 'Content-Type': 'application/json' };
                let currentToken = getToken();
                if (currentToken) {
                    headers['X-Github-Token'] = currentToken;
                }

                let res = await fetch('/api/vps', {
                    method: 'GET',
                    headers: headers
                });
                let data = await res.json();
                if (data.success) renderVPS(data.vps);
            } catch (err) { console.error(err); }
        }

        function renderVPS(vpsList) {
            const grid = document.getElementById('vps-grid');
            const emptyState = document.getElementById('empty-state');
            grid.innerHTML = '';

            if (vpsList.length === 0) {
                emptyState.classList.remove('hidden');
                setTimeout(() => emptyState.classList.remove('scale-95', 'opacity-0'), 50);
                return;
            } else { emptyState.classList.add('hidden', 'scale-95', 'opacity-0'); }

            vpsList.forEach((vps, index) => {
                const card = document.createElement('div');
                card.className = "vps-card glass-panel rounded-2xl overflow-hidden shadow-2xl flex flex-col transition-all duration-300 transform hover:-translate-y-1 glow-effect opacity-0 translate-y-4";
                
                let iframeContent = vps.link ? `<iframe src="${vps.link}" class="w-full h-full border-0" allowfullscreen></iframe>` : 
                    `<div class="absolute inset-0 flex flex-col items-center justify-center text-slate-500">
                        <div class="animate-spin h-6 w-6 border-2 border-slate-600 border-t-blue-500 rounded-full mb-3"></div>
                        <span class="text-xs font-medium tracking-wider animate-pulse">ĐANG CÀI ĐẶT VNC & CLOUDFLARE...</span>
                    </div>`;

                let linkBadge = vps.link ? `<a href="${vps.link}" target="_blank" class="text-[11px] font-mono text-blue-400 hover:underline truncate block max-w-[220px]">${vps.link}</a>` : 
                    `<span class="text-[11px] text-yellow-400 animate-pulse font-medium">Đang khởi tạo / Chờ lấy link...</span>`;

                let timeLeft = formatTimeRemaining(vps.created_at || (Date.now() / 1000));

                card.innerHTML = `
                    <div class="px-5 py-3.5 border-b border-slate-800/80 flex justify-between items-center bg-slate-900/60 backdrop-blur">
                        <div class="flex items-center gap-3 overflow-hidden">
                            <span class="relative flex h-3 w-3 flex-shrink-0">
                              <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-blue-400 opacity-75"></span>
                              <span class="relative inline-flex rounded-full h-3 w-3 bg-blue-500"></span>
                            </span>
                            <div class="truncate">
                                <h3 class="font-bold text-sm text-slate-100 tracking-wide truncate flex items-center gap-2">
                                    ${vps.name} 
                                    <span class="text-[10px] bg-indigo-500/20 text-indigo-300 border border-indigo-500/30 px-2 py-0.5 rounded-full font-mono">⏳ Còn: <span class="countdown-timer" data-created="${vps.created_at || Date.now() / 1000}">${timeLeft}</span></span>
                                </h3>
                                ${linkBadge}
                            </div>
                        </div>
                        <div class="flex items-center gap-2 flex-shrink-0">
                            ${vps.link ? `<a href="${vps.link}" target="_blank" class="bg-slate-800/80 hover:bg-slate-700 text-slate-200 px-3 py-1.5 rounded-xl text-[11px] font-semibold transition flex items-center gap-1 border border-slate-700/40 hover:border-blue-500/50">Mở To ↗</a>` : ''}
                            <a href="${vps.url}" target="_blank" class="text-slate-400 hover:text-white p-1.5 rounded-xl hover:bg-slate-800 transition" title="Xem Repository">📂</a>
                        </div>
                    </div>
                    <div class="relative w-full h-[460px] bg-[#09090b]">
                        ${iframeContent}
                    </div>
                `;
                grid.appendChild(card);
                setTimeout(() => card.classList.remove('opacity-0', 'translate-y-4'), index * 100);
            });
        }

        setInterval(() => {
            document.querySelectorAll('.countdown-timer').forEach(el => {
                el.innerText = formatTimeRemaining(parseFloat(el.getAttribute('data-created')));
            });
        }, 1000);

        setInterval(fetchVPSListFromGitHub, 15000);
    </script>
</body>
</html>
